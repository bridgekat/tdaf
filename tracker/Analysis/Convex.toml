kind = 'project'
title = 'Convex analysis'
module = 'Tdaf.Analysis.Convex'
notes = '''
Convex sets and extended-real-valued convex functions over real vector spaces. Read the module
docstring of `Tdaf.Analysis.Convex` before adding anything here; the two conventions that decide
where a new result belongs are:

* **Four levels of generality** — real vector space, topological vector space, locally convex
  space, finite-dimensional Euclidean space — and each result is stated at the weakest of them
  that carries it. A new node states its hypotheses the same way; if a proof needs `ri C` to be
  non-empty it is a finite-dimensional result, and saying so is not a defect.
* **Duality is against a dual pair** `B : E →ₗ[ℝ] F →ₗ[ℝ] ℝ`, not a topological dual. The side
  conditions live in `Analysis.Convex.Duality.Pairing` and are asked for only where they are needed.

A convex function is a total `E → EReal`, `⊤` off its effective domain and `⊥` only when improper,
so properness is a hypothesis wherever `⊥` would spoil an identity. `Eponyms` is the quickest way
in: it aliases the results that have names.
'''
