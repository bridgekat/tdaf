notes = '''
R. T. Rockafellar, *Convex Analysis* (Princeton University Press, 1970), all thirty-nine sections.
466 of the book's 471 numbered results are formalized; the five exceptions are the
elementary-vector development of §22, which the book itself presents as independent of convexity.

A declaration is named for the result it states, so the name is the index — `theorem_33_1` is
Theorem 33.1, `corollary_37_5_2` is Corollary 37.5.2 — and every such node carries that citation in
its `source`. Where one numbered result needs several declarations, a trailing word tells them
apart. Everything is in the flat `Rockafellar` namespace, one group per section.
'''
