name = "tdaf"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Tdaf"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no per-file copyright header; the licence lives at the root
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[require]]
name = "tracker"
git = "https://github.com/bridgekat/tracker"

[[lean_lib]]
name = "Tdaf"
