name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # `check` resolves every node against the library just built, and `lint` then reuses that
      # cache rather than checking again. `lint` is the gate: it fails when a node stops resolving,
      # because a renamed or deleted declaration leaves the node open and an open node with no
      # `kind` is a plan error.
      - name: Check the plan
        run: |
          lake exe tracker check
          lake exe tracker lint
      - uses: leanprover-community/docgen-action@v1
        with:
          blueprint: false
          homepage: site
